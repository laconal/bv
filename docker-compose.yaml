services:
  postgres:
    image: postgres:18
    container_name: birid-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: birid-pgbouncer
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${DB_USER}
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:6432:6432"

  redis:
    image: redis:7-alpine
    container_name: birid-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru

  minio:
    # :latest requires x86-64-v2 CPU instructions (SSE4.2/POPCNT) - pinned to
    # a -cpuv1 build for compatibility with older/virtualized CPUs. See
    # https://github.com/minio/minio/issues/18365
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: birid-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # One-shot: waits for minio, creates the bucket the app expects
  # (MINIO_BUCKET_NAME) if it doesn't already exist, then exits. django/
  # celery below wait for this to finish successfully before starting.
  minio-init:
    # same x86-64-v2 issue as minio above - pinned to a -cpuv1 build.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    container_name: birid-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}; do sleep 1; done &&
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME}
      "

  django:
    build: .
    container_name: birid-django
    env_file:
      - .env
    environment:
      # Django/Celery talk to postgres through pgbouncer, never directly -
      # see DISABLE_SERVER_SIDE_CURSORS in birid/settings.py.
      DB_HOST: pgbouncer
      DB_PORT: 6432
      # .env's CELERY_BROKER_URL/RESULT_BACKEND and MINIO_ENDPOINT_URL say
      # "localhost" for bare local dev - inside a container that's the
      # container itself, not the redis/minio services.
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      # JWT keys must survive container recreation - entrypoint.sh only
      # generates them if missing, but that's useless without a place for
      # them to persist. Shared with celery below for consistency, though
      # celery doesn't actually read them.
      - ./birid/secrets:/app/birid/secrets

  celery-worker:
    build: .
    container_name: birid-celery-worker
    env_file:
      - .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    command: ["celery", "-A", "birid", "worker", "--loglevel=info"]
    volumes:
      - ./birid/secrets:/app/birid/secrets

  celery-beat:
    build: .
    container_name: birid-celery-beat
    env_file:
      - .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    command: ["celery", "-A", "birid", "beat", "--loglevel=info"]
    volumes:
      - ./birid/secrets:/app/birid/secrets

volumes:
  postgres_data:
  redis_data:
  minio_data:
