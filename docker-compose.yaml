services:
  postgres:
    image: postgres:18
    container_name: birid-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: birid-pgbouncer
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${DB_USER}
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:6432:6432"

  redis:
    image: redis:7-alpine
    container_name: birid-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru

  minio:
    build: docker/minio
    image: birid-minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: build
    container_name: birid-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: birid-minio:RELEASE.2025-09-07T16-13-09Z
    # same image the minio service builds - never try to pull it from a registry.
    pull_policy: never
    container_name: birid-minio-init
    depends_on:
      minio:
        condition: service_started
    # Also grants anonymous read of objects - file URLs are unsigned
    # (AWS_QUERYSTRING_AUTH = False) and fetched directly by the frontend.
    # GetObject only, not mc's `download` preset: that one also grants
    # s3:ListBucket, which would let anyone enumerate every key in the bucket.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}; do sleep 1; done
        mc mb --ignore-existing local/${MINIO_BUCKET_NAME}
        cat > /tmp/policy.json <<'EOF'
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::${MINIO_BUCKET_NAME}/*"]}]}
        EOF
        mc anonymous set-json /tmp/policy.json local/${MINIO_BUCKET_NAME}

  django:
    build: .
    container_name: birid-django
    env_file:
      - .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./birid/secrets:/app/birid/secrets

  celery-worker:
    build: .
    container_name: birid-celery-worker
    env_file:
      - .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    command: ["celery", "-A", "birid", "worker", "--loglevel=info"]
    volumes:
      - ./birid/secrets:/app/birid/secrets

  celery-beat:
    build: .
    container_name: birid-celery-beat
    env_file:
      - .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    command: ["celery", "-A", "birid", "beat", "--loglevel=info"]
    volumes:
      - ./birid/secrets:/app/birid/secrets

volumes:
  postgres_data:
  redis_data:
  minio_data:
